<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Siddharth Verma – Digital Business Card. Connect instantly via phone, WhatsApp, email, LinkedIn or view his resume." />
  <title>Siddharth Verma | Digital Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #0d2240;
      --navy-mid:    #1a3a6b;
      --blue:        #1d6aeb;
      --blue-bright: #3b82f6;
      --blue-sky:    #93c5fd;
      --white:       #ffffff;
      --off-white:   #f2f6fd;
      --gray-200:    #dbe6f7;
      --gray-300:    #b8cce8;
      --gray-400:    #7a8fb0;
      --gray-700:    #374151;
      --radius-md:   14px;
      --radius-lg:   26px;
      --radius-full: 9999px;
    }

    html, body {
      min-height: 100vh;
      background: linear-gradient(145deg, #c8dcf7 0%, #d8e8fb 50%, #bfd3f5 100%);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .page-wrapper {
      width: 100%;
      max-width: 385px;
      animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card ── */
    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow:
        0 12px 48px rgba(13,34,64,0.2),
        0 3px 10px rgba(13,34,64,0.08),
        0 0 0 1px rgba(29,106,235,0.07);
      overflow: hidden;
      position: relative;
    }

    /* ── Corner swooshes ── */
    .swoosh-tl, .swoosh-br {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }
    .swoosh-tl { top: 0; left: 0; }
    .swoosh-br { bottom: 0; right: 0; }

    .card-content { position: relative; z-index: 1; }

    /* ── Share btn ── */
    .share-row {
      display: flex;
      justify-content: flex-end;
      padding: 14px 14px 0;
    }

    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: transparent;
      border: 1.5px solid rgba(13,34,64,0.22);
      border-radius: var(--radius-full);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .share-btn:hover {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }

    /* ── Avatar with LIVE spinning ring ── */
    .avatar-section {
      display: flex;
      justify-content: center;
      padding: 14px 24px 0;
    }

    /* Outer wrapper — holds the spinning pseudo-element */
    .avatar-wrap {
      position: relative;
      width: 148px;
      height: 148px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Glow beneath the ring */
      filter: drop-shadow(0 6px 20px rgba(29,106,235,0.38));
    }

    /* The spinning conic-gradient ring */
    .avatar-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #0d2240 0%,
        #1d6aeb 20%,
        #60a5fa 40%,
        #bfdbfe 50%,
        #60a5fa 60%,
        #1d6aeb 80%,
        #0d2240 100%
      );
      animation: spin-ring 2.8s linear infinite;
      z-index: 0;
    }

    @keyframes spin-ring {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Static photo holder — sits on top */
    .avatar-photo-wrap {
      position: relative;
      z-index: 1;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: var(--white);
      padding: 4px;
      overflow: hidden;
    }

    .avatar-photo-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* ── Identity ── */
    .identity {
      text-align: center;
      padding: 16px 20px 4px;
    }

    .identity h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.4px;
      line-height: 1.15;
    }

    .identity .degree {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--blue);
      letter-spacing: 0.7px;
      text-transform: uppercase;
      margin-top: 9px;
    }

    .identity .university {
      font-size: 12px;
      font-weight: 400;
      color: var(--gray-400);
      letter-spacing: 0.5px;
      margin-top: 3px;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gray-300), transparent);
      margin: 18px 20px 14px;
    }

    /* ── Contact buttons ── */
    .contact-list {
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .contact-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: var(--off-white);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-md);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(13,34,64,0.07);
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.12s;
    }

    .contact-btn:hover {
      background: #e8f0fc;
      border-color: var(--blue-bright);
      box-shadow: 0 4px 16px rgba(29,106,235,0.15);
      transform: translateY(-1px);
    }

    .contact-btn:active {
      transform: translateY(0);
      background: #d8e6fb;
    }

    /* Navy filled icon circle */
    .btn-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--navy-mid), var(--navy));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--white);
      font-size: 16px;
      box-shadow: 0 3px 8px rgba(13,34,64,0.25);
    }

    /* Vertical separator */
    .btn-divider {
      width: 1.5px;
      height: 28px;
      background: var(--gray-300);
      flex-shrink: 0;
    }

    .btn-text { flex: 1; min-width: 0; }

    .btn-text .label {
      font-size: 10px;
      font-weight: 700;
      color: var(--gray-400);
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }

    .btn-text .value {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--navy);
      margin-top: 1.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Always-visible chevron */
    .btn-arrow {
      color: var(--blue-bright);
      font-size: 13px;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .contact-btn:hover .btn-arrow { transform: translateX(3px); }

    .contact-btn.no-action { cursor: default; }
    .contact-btn.no-action:hover {
      transform: none;
      background: var(--off-white);
      border-color: var(--gray-200);
      box-shadow: 0 2px 8px rgba(13,34,64,0.07);
    }

    /* ── Resume button ── */
    .resume-wrap { padding: 16px 14px 8px; }

    .resume-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 15px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--navy-mid) 0%, var(--navy) 100%);
      color: var(--white);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      box-shadow: 0 6px 20px rgba(13,34,64,0.32);
      transition: box-shadow 0.15s, transform 0.12s, filter 0.15s;
    }

    .resume-btn:hover {
      filter: brightness(1.15);
      box-shadow: 0 10px 28px rgba(13,34,64,0.38);
      transform: translateY(-1px);
    }

    .resume-btn:active { transform: translateY(0); }

    /* ── Dubai skyline ── */
    .skyline-section {
      height: 90px;
      overflow: hidden;
      margin-top: 6px;
      position: relative;
    }

    .skyline-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, var(--white) 100%);
      z-index: 1;
    }

    .skyline-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      opacity: 0.22;
      display: block;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--navy);
      color: var(--white);
      padding: 11px 20px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(0,0,0,0.22);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
      opacity: 0;
      z-index: 9999;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 360px) {
      .identity h1 { font-size: 24px; }
      .avatar-wrap { width: 128px; height: 128px; }
      .avatar-photo-wrap { width: 114px; height: 114px; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast" role="status" aria-live="polite">
  <i class="fa-solid fa-circle-check"></i>
  <span id="toast-msg">Link copied!</span>
</div>

<div class="page-wrapper">
  <div class="card" role="main">

    <!-- Top-left navy swoosh -->
    <svg class="swoosh-tl" width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 0 C70 0 150 0 150 0 C150 0 105 12 82 40 C59 68 55 110 18 132 C0 143 0 150 0 150 Z" fill="#0d2240"/>
      <path d="M0 0 C45 0 100 0 100 0 C100 0 70 10 52 32 C34 54 30 88 8 108 C0 116 0 130 0 130 Z" fill="#1a3a6b" opacity="0.6"/>
    </svg>

    <!-- Bottom-right navy swoosh -->
    <svg class="swoosh-br" width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M150 150 C80 150 0 150 0 150 C0 150 45 138 68 110 C91 82 95 40 132 18 C150 7 150 0 150 0 Z" fill="#0d2240"/>
      <path d="M150 150 C105 150 50 150 50 150 C50 150 80 140 98 118 C116 96 120 62 142 42 C150 34 150 20 150 20 Z" fill="#1a3a6b" opacity="0.6"/>
    </svg>

    <div class="card-content">

      <!-- Share -->
      <div class="share-row">
        <button class="share-btn" id="share-btn" onclick="shareCard()" aria-label="Share digital card">
          <i class="fa-solid fa-share-nodes"></i>
          Share
        </button>
      </div>

      <!-- Avatar with live spinning ring -->
      <div class="avatar-section">
        <div class="avatar-wrap">
          <div class="avatar-photo-wrap">
            <img src="avatar.png" alt="Siddharth Verma" />
          </div>
        </div>
      </div>

      <!-- Identity -->
      <div class="identity">
        <h1>Siddharth Verma</h1>
        <p class="degree">MBA in AI &amp; Business Analytics</p>
        <p class="university">Middlesex University Dubai</p>
      </div>

      <div class="divider"></div>

      <!-- Contact buttons -->
      <div class="contact-list" role="list">

        <a class="contact-btn" href="mailto:siddharthv327@gmail.com" id="email-btn" role="listitem" aria-label="Email Siddharth">
          <div class="btn-icon"><i class="fa-solid fa-envelope"></i></div>
          <div class="btn-divider"></div>
          <div class="btn-text">
            <div class="label">Email</div>
            <div class="value">siddharthv327@gmail.com</div>
          </div>
          <i class="fa-solid fa-chevron-right btn-arrow"></i>
        </a>

        <a class="contact-btn" href="tel:+971557576133" id="phone-btn" role="listitem" aria-label="Call Siddharth">
          <div class="btn-icon"><i class="fa-solid fa-phone"></i></div>
          <div class="btn-divider"></div>
          <div class="btn-text">
            <div class="label">Phone</div>
            <div class="value">+971 55 757 6133</div>
          </div>
          <i class="fa-solid fa-chevron-right btn-arrow"></i>
        </a>

        <a class="contact-btn" href="https://wa.me/971557576133" target="_blank" rel="noopener noreferrer" id="whatsapp-btn" role="listitem" aria-label="WhatsApp Siddharth">
          <div class="btn-icon"><i class="fa-brands fa-whatsapp"></i></div>
          <div class="btn-divider"></div>
          <div class="btn-text">
            <div class="label">WhatsApp</div>
            <div class="value">+971 55 757 6133</div>
          </div>
          <i class="fa-solid fa-chevron-right btn-arrow"></i>
        </a>

        <div class="contact-btn no-action" role="listitem" aria-label="Location: Dubai, UAE">
          <div class="btn-icon"><i class="fa-solid fa-location-dot"></i></div>
          <div class="btn-divider"></div>
          <div class="btn-text">
            <div class="label">Location</div>
            <div class="value">Dubai, United Arab Emirates</div>
          </div>
        </div>

        <a class="contact-btn" href="https://www.linkedin.com/in/siddharth-verma-1805sv" target="_blank" rel="noopener noreferrer" id="linkedin-btn" role="listitem" aria-label="LinkedIn profile">
          <div class="btn-icon"><i class="fa-brands fa-linkedin-in"></i></div>
          <div class="btn-divider"></div>
          <div class="btn-text">
            <div class="label">LinkedIn</div>
            <div class="value">siddharth-verma-1805sv</div>
          </div>
          <i class="fa-solid fa-chevron-right btn-arrow"></i>
        </a>

      </div>

      <!-- Resume -->
      <div class="resume-wrap">
        <a class="resume-btn" href="https://drive.google.com/file/d/1oVyN407GsxbirAGuAL4IzzozWd01-9-s/view?usp=drive_link" target="_blank" rel="noopener noreferrer" id="resume-btn" aria-label="View Resume">
          <i class="fa-solid fa-file-lines"></i>
          View Resume
        </a>
      </div>

      <!-- Dubai skyline -->
      <div class="skyline-section">
        <img class="skyline-img" src="skyline.png" alt="Dubai Skyline" />
      </div>

    </div>
  </div>
</div>

<script>
  async function shareCard() {
    const cardUrl = window.location.href;
    const shareData = {
      title: 'Siddharth Verma \u2013 Digital Business Card',
      text: 'Connect with Siddharth Verma via his digital business card.',
      url: cardUrl,
    };
    if (navigator.share) {
      try { await navigator.share(shareData); }
      catch (err) { if (err.name !== 'AbortError') fallbackCopy(cardUrl); }
    } else {
      fallbackCopy(cardUrl);
    }
  }

  function fallbackCopy(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => showToast('\uD83D\uDCCB Link copied to clipboard!'));
    } else {
      const el = document.createElement('textarea');
      el.value = text;
      el.style.cssText = 'position:absolute;left:-9999px';
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast('\uD83D\uDCCB Link copied to clipboard!');
    }
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.contact-btn').forEach((item, i) => {
      item.style.opacity = '0';
      item.style.transform = 'translateY(12px)';
      setTimeout(() => {
        item.style.transition = 'opacity 0.3s ease, transform 0.3s ease, background 0.15s, border-color 0.15s, box-shadow 0.15s';
        item.style.opacity = '1';
        item.style.transform = 'translateY(0)';
      }, 160 + i * 60);
    });
  });
</script>
</body>
</html>
