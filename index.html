<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Siddharth Verma – Digital Business Card. Connect instantly via phone, WhatsApp, email, LinkedIn or view his resume." />
  <title>Siddharth Verma | Digital Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:       #1d6aeb;
      --blue-dark:  #1251c4;
      --blue-light: #e8f0fe;
      --blue-mid:   #c7d9fc;
      --white:      #ffffff;
      --gray-50:    #f7f9fc;
      --gray-100:   #eef1f6;
      --gray-300:   #d0d7e3;
      --gray-400:   #9aa5bc;
      --gray-600:   #5a6478;
      --gray-900:   #111827;
      --radius-sm:  10px;
      --radius-md:  16px;
      --radius-lg:  24px;
      --radius-xl:  32px;
      --radius-full: 9999px;
    }

    html, body {
      min-height: 100vh;
      background: #dde8fb;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .page-wrapper {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Share button */
    .share-row {
      display: flex;
      justify-content: flex-end;
    }

    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      background: var(--white);
      border: 1.5px solid var(--gray-300);
      border-radius: var(--radius-full);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-600);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
      text-decoration: none;
    }

    .share-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
      box-shadow: 0 2px 12px rgba(29,106,235,0.12);
    }

    .share-btn i { font-size: 14px; }

    /* Card */
    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(29,106,235,0.08);
      box-shadow: 0 4px 28px rgba(17, 24, 39, 0.08), 0 1px 4px rgba(17, 24, 39, 0.04);
      overflow: hidden;
    }

    /* Header */
    .card-header {
      background: var(--blue);
      padding: 28px 24px 64px;
      text-align: center;
      position: relative;
    }

    .card-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: var(--white);
      border-radius: 50% 50% 0 0 / 28px 28px 0 0;
    }

    .brand-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: var(--radius-full);
      padding: 5px 14px;
      margin-bottom: 22px;
    }

    .brand-label i { font-size: 12px; color: rgba(255,255,255,0.9); }
    .brand-label span { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.9); letter-spacing: 0.5px; }

    /* Avatar */
    .avatar-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .avatar-ring {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--white);
      padding: 3px;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.25), 0 8px 24px rgba(0,0,0,0.16);
      position: relative;
      z-index: 2;
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .side-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--white);
      font-size: 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.15s, transform 0.15s;
      z-index: 3;
    }

    .side-btn.left  { left: 16px; }
    .side-btn.right { right: 16px; }
    .side-btn:hover { background: rgba(255,255,255,0.32); transform: scale(1.08); }
    .side-btn:active { transform: scale(0.94); }

    /* Identity */
    .card-identity {
      padding: 14px 24px 0;
      text-align: center;
    }

    .card-identity h1 {
      font-size: 23px;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: -0.4px;
    }

    .card-identity .title {
      font-size: 13px;
      font-weight: 500;
      color: var(--blue);
      margin-top: 3px;
      letter-spacing: 0.2px;
    }

    /* Divider */
    .divider {
      margin: 16px 20px 0;
      height: 1px;
      background: var(--gray-100);
    }

    /* LinkedIn pill */
    .linkedin-row {
      padding: 14px 20px 4px;
      display: flex;
      justify-content: center;
    }

    .linkedin-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      background: var(--blue-light);
      border-radius: var(--radius-full);
      text-decoration: none;
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--blue-mid);
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }

    .linkedin-pill:hover {
      background: var(--blue);
      color: var(--white);
      border-color: var(--blue);
      box-shadow: 0 4px 14px rgba(29,106,235,0.28);
    }

    .linkedin-pill i { font-size: 14px; }

    /* Contact list */
    .contact-list {
      padding: 14px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 10px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--gray-900);
      transition: background 0.15s, transform 0.15s;
    }

    .contact-item:not(.no-link):hover {
      background: var(--gray-50);
      transform: translateX(3px);
    }

    .contact-item:not(.no-link):active {
      background: var(--blue-light);
      transform: translateX(1px);
    }

    .contact-item.no-link { cursor: default; }

    .contact-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .contact-icon.phone    { background: #e8f5e9; color: #2e7d32; }
    .contact-icon.whatsapp { background: #e8f5e9; color: #1daa5c; }
    .contact-icon.email    { background: #fce4ec; color: #c62828; }
    .contact-icon.location { background: var(--blue-light); color: var(--blue); }

    .contact-text { flex: 1; min-width: 0; }
    .contact-text .label {
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-400);
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }
    .contact-text .value {
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-900);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-arrow {
      color: var(--gray-300);
      font-size: 12px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
    }
    .contact-item:hover .contact-arrow { opacity: 1; transform: translateX(2px); }

    /* Resume button */
    .resume-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 10px 14px 14px;
      padding: 15px;
      border-radius: var(--radius-md);
      background: var(--blue);
      color: var(--white);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1px;
      transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
    }

    .resume-btn:hover {
      background: var(--blue-dark);
      box-shadow: 0 6px 20px rgba(29,106,235,0.32);
      transform: translateY(-1px);
    }

    .resume-btn:active { transform: translateY(0); box-shadow: none; }

    /* Footer */
    .card-footer {
      padding: 10px 20px 16px;
      text-align: center;
      border-top: 1px solid var(--gray-100);
    }

    .card-footer p {
      font-size: 12px;
      color: var(--gray-400);
      font-weight: 400;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--gray-900);
      color: var(--white);
      padding: 11px 20px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
      opacity: 0;
      z-index: 9999;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 380px) {
      .card-identity h1 { font-size: 20px; }
      .side-btn.left  { left: 8px; }
      .side-btn.right { right: 8px; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast" role="status" aria-live="polite">
  <i class="fa-solid fa-circle-check"></i>
  <span id="toast-msg">Link copied!</span>
</div>

<div class="page-wrapper">

  <!-- Share button -->
  <div class="share-row">
    <button class="share-btn" id="share-btn" onclick="shareCard()" aria-label="Share digital card">
      <i class="fa-solid fa-share-nodes"></i>
      Share
    </button>
  </div>

  <div class="card" role="main">

    <!-- Header -->
    <div class="card-header">
      <div class="brand-label">
        <i class="fa-solid fa-id-card"></i>
        <span>Digital Card</span>
      </div>

      <div class="avatar-wrap">
        <a class="side-btn left"
           href="tel:+971557576133"
           id="phone-side-btn"
           aria-label="Call Siddharth Verma">
          <i class="fa-solid fa-phone"></i>
        </a>

        <div class="avatar-ring">
          <img src="avatar.png" alt="Siddharth Verma" />
        </div>

        <a class="side-btn right"
           href="https://mail.google.com/mail/?view=cm&fs=1&to=siddharthv327@gmail.com"
           target="_blank"
           rel="noopener noreferrer"
           id="email-side-btn"
           aria-label="Email Siddharth Verma">
          <i class="fa-solid fa-envelope"></i>
        </a>
      </div>
    </div>

    <!-- Identity -->
    <div class="card-identity">
      <h1>Siddharth Verma</h1>
      <p class="title">Professional</p>
    </div>

    <div class="divider"></div>

    <!-- LinkedIn -->
    <div class="linkedin-row">
      <a class="linkedin-pill"
         href="https://www.linkedin.com/in/siddharth-verma-1805sv"
         target="_blank"
         rel="noopener noreferrer"
         id="linkedin-link"
         aria-label="LinkedIn profile">
        <i class="fa-brands fa-linkedin-in"></i>
        Connect on LinkedIn
      </a>
    </div>

    <!-- Contact list -->
    <div class="contact-list" role="list">

      <a class="contact-item"
         href="tel:+971557576133"
         id="phone-contact"
         role="listitem"
         aria-label="Call +971 55 757 6133">
        <div class="contact-icon phone"><i class="fa-solid fa-phone"></i></div>
        <div class="contact-text">
          <div class="label">Phone</div>
          <div class="value">+971 55 757 6133</div>
        </div>
        <i class="fa-solid fa-chevron-right contact-arrow"></i>
      </a>

      <a class="contact-item"
         href="https://wa.me/971557576133"
         target="_blank"
         rel="noopener noreferrer"
         id="whatsapp-contact"
         role="listitem"
         aria-label="Open WhatsApp chat">
        <div class="contact-icon whatsapp"><i class="fa-brands fa-whatsapp"></i></div>
        <div class="contact-text">
          <div class="label">WhatsApp</div>
          <div class="value">+971 55 757 6133</div>
        </div>
        <i class="fa-solid fa-chevron-right contact-arrow"></i>
      </a>

      <a class="contact-item"
         href="https://mail.google.com/mail/?view=cm&fs=1&to=siddharthv327@gmail.com"
         target="_blank"
         rel="noopener noreferrer"
         id="email-contact"
         role="listitem"
         aria-label="Send email to Siddharth">
        <div class="contact-icon email"><i class="fa-solid fa-envelope"></i></div>
        <div class="contact-text">
          <div class="label">Email</div>
          <div class="value">siddharthv327@gmail.com</div>
        </div>
        <i class="fa-solid fa-chevron-right contact-arrow"></i>
      </a>

      <div class="contact-item no-link" role="listitem" aria-label="Location: Dubai, UAE">
        <div class="contact-icon location"><i class="fa-solid fa-location-dot"></i></div>
        <div class="contact-text">
          <div class="label">Location</div>
          <div class="value">Dubai, UAE</div>
        </div>
      </div>

    </div>

    <!-- Resume -->
    <a class="resume-btn"
       href="https://drive.google.com/file/d/1oVyN407GsxbirAGuAL4IzzozWd01-9-s/view?usp=drive_link"
       target="_blank"
       rel="noopener noreferrer"
       id="resume-btn"
       aria-label="View Resume on Google Drive">
      <i class="fa-solid fa-file-lines"></i>
      View Resume
    </a>

    <!-- Footer -->
    <div class="card-footer">
      <p>Siddharth Verma &middot; Dubai, UAE</p>
    </div>

  </div>
</div>

<script>
  async function shareCard() {
    const cardUrl = window.location.href;
    const shareData = {
      title: 'Siddharth Verma \u2013 Digital Business Card',
      text: 'Connect with Siddharth Verma via his digital business card.',
      url: cardUrl,
    };
    if (navigator.share) {
      try { await navigator.share(shareData); }
      catch (err) { if (err.name !== 'AbortError') fallbackCopy(cardUrl); }
    } else {
      fallbackCopy(cardUrl);
    }
  }

  function fallbackCopy(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => showToast('\uD83D\uDCCB Link copied to clipboard!'));
    } else {
      const el = document.createElement('textarea');
      el.value = text;
      el.style.cssText = 'position:absolute;left:-9999px';
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast('\uD83D\uDCCB Link copied to clipboard!');
    }
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.contact-item').forEach((item, i) => {
      item.style.opacity = '0';
      item.style.transform = 'translateX(-16px)';
      setTimeout(() => {
        item.style.transition = 'opacity 0.35s ease, transform 0.35s ease, background 0.15s ease';
        item.style.opacity = '1';
        item.style.transform = 'translateX(0)';
      }, 280 + i * 80);
    });
  });
</script>
</body>
</html>
